name: MSYS2 MinGW-w64 Windows 64bit Build

on:
  push:
    branches:
      - release
      - devel
    paths:
    - 'tiny_gltf.*'
    - 'tinygltf_json_c.h'
    - 'CMakeLists.txt'
    - 'meson.build'
    - 'meson_options.txt'
    - 'tests/tester_v3*.c'
    - '.github/workflows/mingw-w64-msys2.yml'
  pull_request:
  workflow_dispatch:

jobs:
  mingw-w64-msys2-build:
    name: MSYS2 MinGW-w64 Windows Build
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: 'C:\msys64\usr\bin\bash.exe -leo pipefail {0}'
    steps:
      - uses: actions/checkout@v5

      - name: Install core & build dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: |
          cmake \
            -G"Ninja" \
            -S . \
            -B build \
            -DTINYGLTF_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure
